name: Palladium Daily Intelligence

on:
  schedule:
    # 매일 오전 10시 10분 (한국 시간, Asia/Seoul).
    # GitHub Actions 'schedule'은 timezone 키를 지원하지 않으므로 UTC로 변환:
    # 10:10 KST = 01:10 UTC (KST = UTC+9). 정각(:00) 실행은 피한다.
    - cron: '10 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Palladium scanner (rules only, no AI)
        env:
          TZ: 'Asia/Seoul'
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          AI_ENABLED: 'false'
          FRED_API_KEY: ${{ secrets.FRED_API_KEY || '' }}
          DART_API_KEY: ${{ secrets.DART_API_KEY || '' }}
          REAL_ESTATE_API_KEY: ${{ secrets.REAL_ESTATE_API_KEY || '' }}
          HN_MIN_POINTS: '50'
          HN_HOURS_BACK: '48'
          REPO_URL: 'https://github.com/dibi2dab/palladium'
          REPO_BRANCH: 'main'
        run: python -m src.main

      - name: Commit updated data and reports
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ reports/
          git diff --staged --quiet || git commit -m "Palladium daily intelligence 2026 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git push